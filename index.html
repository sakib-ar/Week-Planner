<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <h1>Week Planner</h1>
  <div class="nav">
    <button class="btn" id="today">Today</button>
    <button class="btn" id="prev" aria-label="Previous week">&lsaquo;</button>
    <button class="btn" id="next" aria-label="Next week">&rsaquo;</button>
  </div>
  <div class="range" id="range"></div>
  <div class="spacer"></div>
  <button class="btn primary" id="add">New event</button>
</header>

<main class="scroller" id="scroller">
  <div class="cal">
    <div class="row head" id="head"></div>
    <div class="row" id="body"></div>
  </div>
</main>

<dialog id="dlg">
  <form id="form">
    <h2 id="dlgTitle">New event</h2>
    <label>Title<input type="text" id="f-title" placeholder="Add a title" maxlength="80"></label>
    <label>Date<input type="date" id="f-date" required></label>
    <div class="two">
      <label>Start time<input type="time" id="f-start" required></label>
      <label>End time<input type="time" id="f-end" required></label>
    </div>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Colour"></div>
    <p class="err" id="err" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn danger del" id="del">Delete</button>
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
